<style>
  /* ============ DESIGN TOKENS ============ */
  :root {
    --bg-base: #0a0612;
    --bg-warm: #1a0e2a;
    --ink: #f5f0e8;
    --ink-soft: rgba(245, 240, 232, 0.72);
    --ink-mute: rgba(245, 240, 232, 0.45);
    --glass: rgba(255, 255, 255, 0.06);
    --glass-hover: rgba(255, 255, 255, 0.1);
    --border: rgba(255, 255, 255, 0.12);
    --border-strong: rgba(255, 255, 255, 0.2);
    --accent-gold: #f4c66c;
    --accent-rose: #ff6b9d;
    --accent-violet: #9d7cf4;
    --accent-cyan: #6cd4f4;

    /* Brand colors */
    --c-wa: #25d366;
    --c-tg: #29a9eb;
    --c-ig: #e1306c;
    --c-fb: #1877f2;
    --c-tt: #ff0050;
    --c-yt: #ff0000;
    --c-tp: #42b549;
    --c-sp: #ee4d2d;
    --c-web: #f4c66c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--bg-base);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* ============ BACKGROUND AURORA ============ */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(157, 124, 244, 0.35), transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 20%, rgba(244, 198, 108, 0.22), transparent 60%),
      radial-gradient(ellipse 60% 60% at 50% 100%, rgba(255, 107, 157, 0.25), transparent 60%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-warm) 100%);
    z-index: -2;
    animation: aurora 18s ease-in-out infinite alternate;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity: 0.08;
    z-index: -1;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  @keyframes aurora {
    0%   { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.1) rotate(2deg); }
  }

  /* ============ LAYOUT ============ */
  .wrap {
    max-width: 380px; /* mengatur lebar tombol2 dilayar HP android */
    margin: 0 auto;
    padding: 30px 24px 4px; /* mengatur jarak lingkaran NA dgn sisi atas layar HP android */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header & footer tetap sempit & centered, supaya seimbang
     walau .wrap melebar di desktop. Divider span penuh
     mengikuti lebar grid links. */
  .header, .footer {
    max-width: 480px;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  /* ============ HEADER ============ */
  .header {
    text-align: center;
    margin-bottom: 8px;
    animation: rise .8s cubic-bezier(.2,.8,.2,1) both;
  }

  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    margin: 0 auto 12px;
    position: relative;
    padding: 3px;
    background: conic-gradient(from 180deg,
      var(--accent-gold), var(--accent-rose),
      var(--accent-violet), var(--accent-cyan), var(--accent-gold));
    animation: spin 8s linear infinite;
  }
  .avatar::after {
    content: '';
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: inherit;
    filter: blur(20px);
    opacity: 0.5;
    z-index: -1;
  }

  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--bg-warm);
    display: grid;
    place-items: center;
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 500;
    font-style: italic;
    color: var(--ink);
    animation: spin 8s linear infinite reverse;
    /* GANTI INISIAL DI BAWAH ATAU PAKAI <img> */
    /* contoh: <img src="foto.jpg" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover"> */
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .name {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 4px;
  }
  .name em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent-gold);
  }

  .handle {
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  .bio {
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 auto;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0 12px;
    color: var(--ink-mute);
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-weight: 500;
    animation: rise .8s cubic-bezier(.2,.8,.2,1) .1s both;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
  }

  /* ============ LINK BUTTONS ============ */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link {
    --c: var(--accent-gold);
    position: relative;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-decoration: none;
    color: var(--ink);
    overflow: hidden;
    transition: all .3s cubic-bezier(.2,.8,.2,1);
    animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
    /* ============ EFEK EMBOSS / MENONJOL (SANGAT KUAT 3D) ============
       Multi-layer shadow untuk efek 3D maksimal:
       - Outer shadow jauh-besar-gelap → tombol benar2 melayang di atas background
       - Outer shadow medium → bayangan tegas dekat
       - Outer shadow tajam → grounding kontak
       - Inset highlight atas TEBAL → bevel atas seperti tepi logam yang tertimpa cahaya
       - Inset shadow bawah TEBAL → bevel bawah yang dalam
       - Inset rim subtle → garis tepi halus untuk definisi
    */
    box-shadow:
      0 22px 44px -8px rgba(0, 0, 0, 0.85),
      0 12px 20px -4px rgba(0, 0, 0, 0.7),
      0 4px 8px 0 rgba(0, 0, 0, 0.6),
      0 1px 2px 0 rgba(0, 0, 0, 0.5),
      inset 0 3px 0 0 rgba(255, 255, 255, 0.35),
      inset 0 -3px 0 0 rgba(0, 0, 0, 0.55),
      inset 0 0 0 1px rgba(255, 255, 255, 0.08);
  }

  /* Stagger animation delays */
  .link:nth-child(1) { animation-delay: .15s; }
  .link:nth-child(2) { animation-delay: .20s; }
  .link:nth-child(3) { animation-delay: .25s; }
  .link:nth-child(4) { animation-delay: .30s; }
  .link:nth-child(5) { animation-delay: .35s; }
  .link:nth-child(6) { animation-delay: .40s; }
  .link:nth-child(7) { animation-delay: .45s; }
  .link:nth-child(8) { animation-delay: .50s; }
  .link:nth-child(9) { animation-delay: .55s; }

  .link::before {
    content: '';
    position: absolute;
    inset: 0;
    /* Background saat hover: warna brand solid yang menutupi tombol — bukan gradient samar */
    background: linear-gradient(135deg,
      color-mix(in srgb, var(--c) 20%, transparent) 0%,
      color-mix(in srgb, var(--c) 50%, transparent) 70%);
    opacity: 0;
    transition: opacity .35s ease;
  }

  .link:hover {
    transform: translateY(-4px);
    /* Border solid 2px dengan warna brand penuh — tegas terlihat */
    border-color: var(--c);
    background: var(--glass-hover);
    /* Saat hover: shadow 3D lebih tinggi + glow warna brand SANGAT TEGAS */
    box-shadow:
      0 14px 24px -4px color-mix(in srgb, var(--c) 65%, transparent),
      0 12px 20px -4px color-mix(in srgb, var(--c) 45%, transparent),
      0 18px 30px -6px rgba(0, 0, 0, 0.85),
      0 10px 18px -2px rgba(0, 0, 0, 0.7),
      0 2px 4px 0 rgba(0, 0, 0, 0.5),
      inset 0 3px 0 0 rgba(255, 255, 255, 0.5),
      inset 0 -3px 0 0 rgba(0, 0, 0, 0.45),
      0 0 0 2px color-mix(in srgb, var(--c) 50%, transparent);
  }

  .link:hover::before { opacity: 1; }

  /* Saat tombol ditekan: efek "tertekan ke dalam" — bevel terbalik, lebih dalam */
  .link:active {
    transform: translateY(2px);
    box-shadow:
      0 1px 2px 0 rgba(0, 0, 0, 0.5),
      inset 0 4px 8px 0 rgba(0, 0, 0, 0.5),
      inset 0 2px 4px 0 rgba(0, 0, 0, 0.35),
      inset 0 -1px 0 0 rgba(255, 255, 255, 0.05);
  }

  .link .icon {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--c) 18%, transparent);
    display: grid;
    place-items: center;
    color: var(--c);
    transition: transform .3s cubic-bezier(.4,1.5,.5,1);
  }
  .link:hover .icon { transform: scale(1.08) rotate(-4deg); }

  .link .icon svg { width: 22px; height: 22px; }

  .link .text { flex: 1; min-width: 0; }
  .link .title {
    display: block;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .link .sub {
    display: block;
    font-size: 12px;
    color: var(--ink-mute);
    margin-top: 2px;
    font-weight: 400;
  }

  .link .arrow {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: var(--ink-mute);
    transition: transform .3s, color .3s;
  }
  .link:hover .arrow {
    color: var(--c);
    transform: translateX(4px);
  }

  /* Brand color assignments */
  .link.wa  { --c: var(--c-wa); }
  .link.tg  { --c: var(--c-tg); }
  .link.ig  { --c: var(--c-ig); }
  .link.fb  { --c: var(--c-fb); }
  .link.tt  { --c: var(--c-tt); }
  .link.yt  { --c: var(--c-yt); }
  .link.tp  { --c: var(--c-tp); }
  .link.sp  { --c: var(--c-sp); }
  .link.web { --c: var(--c-web); }

  /* ============ FOOTER ============ */
  .footer {
    text-align: center;
    padding-top: 16px;  /* mengatur sisi bwh box link terbawah dgn teks tulisan di footer*/
    font-size: 15px;    /* mengatur ukuran font teks tulisan di footer*/
    color: var(--ink-mute);
    letter-spacing: 0.04em;
    animation: rise .8s cubic-bezier(.2,.8,.2,1) .7s both;
  }
  .footer .heart { color: var(--accent-rose); }

  /* ============ ANIMATIONS ============ */
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 380px) {
    .wrap { padding: 23px 18px 0; }  /* atas 28px (= tinggi teks markiel-olshop), bawah 0 - footer rapat ke sisi bawah layar HP */
    .name { font-size: 28px; }
    .link { padding: 14px 16px; gap: 14px; }
    .link .icon { width: 38px; height: 38px; }
  }

  /* ============ DESKTOP: 2-COLUMN GRID ============ */
  @media (min-width: 768px) {
    .wrap {
      max-width: 600px;
      padding: 68px 24px 12px;
      min-height: 100vh;
    }

    /* Header dibuat lebih compact di desktop */
    .header { margin-bottom: 6px; }
    .avatar { width: 122px; height: 122px; margin: 0 auto 6px; } /* mengatur ukuran lingkaran NA*/
    .avatar-inner { font-size: 38px; }  /* mengatur ukuran font yg ada didlmnya*/
    .name { font-size: 28px; margin-bottom: 2px; }
    .bio { font-size: 13.5px; line-height: 1.45; max-width: 540px; }

    /* Divider lebih dekat ke header & ke tombol;
       span full lebar wrap sehingga sejajar dengan tombol */
    .divider { margin: 8px 0 10px; }

    /* Grid 1 kolom (sama seperti mobile, tombol tersusun vertikal penuh) */
    .links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    /* Trik CSS: link pertama hanya span 2 kolom KALAU
       total .link berjumlah ganjil. Otomatis menyesuaikan
       walau jumlah link berubah di masa depan. */
    .link:first-child:nth-last-child(odd) {
      grid-column: 1 / -1;
    }

    /* Tombol lebih ringkas */
    .link { padding: 10px 16px; gap: 10px; }
    .link .icon { width: 34px; height: 34px; border-radius: 10px; }
    .link .icon svg { width: 28px; height: 28px; }
    .link .title { font-size: 16.5px; }
    .link .sub { font-size: 11.5px; margin-top: 1px; }

    /* Footer rapat ke tombol */
    .footer { padding-top: 24px; font-size: 16.5px; }
  }

  /* Reduce motion for accessibility */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
